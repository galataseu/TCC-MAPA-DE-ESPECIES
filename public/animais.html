<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espécies Ameaçadas - Lista de Animais</title>
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/app.css">
    <style>
        /* Custom styles for the list page to match the dashboard */
        body {
            background-color: #2B2A33;
            color: #eee;
        }
        #main-layout {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #content {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            background: linear-gradient(180deg, #2B2A33 0%, #1a1a1f 100%);
        }
        .animal-card {
            background-color: #3b3a43;
            border: 1px solid #1E7552;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            height: 100%;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        .animal-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
            border-color: #FFAA44;
        }
        .animal-img-container {
            height: 200px;
            overflow: hidden;
            position: relative;
            background-color: #222;
        }
        .animal-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }
        .animal-card:hover .animal-img {
            transform: scale(1.1);
        }
        .status-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            color: #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            z-index: 10;
            text-transform: uppercase;
        }
        .card-body {
            padding: 20px;
        }
        .scientific-name {
            font-style: italic;
            color: #FFAA44;
            font-size: 0.85rem;
            margin-bottom: 12px;
            display: block;
        }
        .card-title {
            color: #fff;
            font-weight: 700;
            margin-bottom: 5px;
            font-size: 1.25rem;
        }
        .animal-info {
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .btn-view {
            background-color: #1E7552;
            color: #fff;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-view:hover {
            background-color: #287f5e;
            color: #fff;
        }
        
        /* Status colors */
        .bg-ex { background-color: #000000; } /* Extinta */
        .bg-ew { background-color: #3f0000; } /* Extinta na Natureza */
        .bg-cr { background-color: #d40000; } /* Criticamente em Perigo */
        .bg-en { background-color: #ff4400; } /* Em Perigo */
        .bg-vu { background-color: #ffaa00; } /* Vulnerável */
        .bg-nt { background-color: #669900; } /* Quase Ameaçada */
        .bg-lc { background-color: #008800; } /* Pouco Preocupante */
        .bg-dd { background-color: #555555; } /* Dados Insuficientes */

        /* Fix for Bootstrap 5 nav conflict */
        #vertical-nav .nav {
            display: block;
            padding-left: 0;
            margin-bottom: 0;
            list-style: none;
        }
    </style>
</head>
<body>
    <div id="main-layout">
        <!-- Sidebar consistent with index.html -->
        <nav id="vertical-nav">
            <div class="nav-section-top">
                <div class="nav-logo">
                    <img src="assets/img/logo.png" alt="Logo">
                </div>
                <ul class="nav">
                    <li>
                        <a href="index.html">
                            <i class="fa-solid fa-map"></i>
                            <span class="nav-label">Mapa</span>
                        </a>
                    </li>
                </ul>
            </div>

            <div class="nav-section-middle">
                <ul class="nav">
                    <li>
                        <a href="#">
                            <i class="fa-solid fa-circle-question"></i>
                            <span class="nav-label">Ajuda</span>
                        </a>
                    </li>
                </ul>
            </div>

            <div class="nav-section-bottom">
                <ul class="nav">
                    <li>
                        <a href="#" class="active">
                            <i class="fa-solid fa-paw" style="color: #FFAA44;"></i>
                            <span class="nav-label">Espécies</span>
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <div id="content">
            <header class="mb-5 d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                <div>
                    <h1 class="fw-bold mb-1">Catálogo de Espécies</h1>
                    <p class="text-secondary mb-0">Explore a biodiversidade ameaçada da Região Sul.</p>
                </div>
                <div style="min-width: 350px;">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-search"></i></span>
                        <input type="text" id="animalSearch" class="form-control search-input" placeholder="Pesquisar por nome ou espécie...">
                    </div>
                </div>
            </header>

            <div id="animalList" class="row g-4">
                <!-- Cards will be injected here -->
                <div class="col-12 text-center py-5" id="loader">
                    <div class="spinner-border text-success" style="width: 3rem; height: 3rem;" role="status">
                        <span class="visually-hidden">Carregando...</span>
                    </div>
                    <p class="mt-3 text-secondary">Carregando espécies...</p>
                </div>
            </div>
            
            <div id="noResults" class="col-12 text-center py-5 d-none">
                <i class="fa-solid fa-magnifying-glass mb-3" style="font-size: 3rem; color: #444;"></i>
                <h3>Nenhum animal encontrado</h3>
                <p class="text-muted">Tente ajustar sua pesquisa ou filtros.</p>
            </div>
        </div>
    </div>

    <!-- Modal de Detalhes -->
    <div class="modal fade" id="animalModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="background-color: #2B2A33;">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title fw-bold" id="modalAnimalName">Nome do Animal</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0" id="modalBody">
                    <!-- Detalhes do animal injetados via JS -->
                </div>
                <div class="modal-footer border-top border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/animais.js"></script>
</body>
</html>
